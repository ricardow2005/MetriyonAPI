name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test Go packages
        run: go test ./...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Build Windows AMD64
        shell: pwsh
        run: |
          $commit = "${{ github.sha }}".Substring(0, 7)
          $date = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          $versionLine = Select-String -Path version/version.go -Pattern 'Version\s*=\s*"([^"]+)"'
          $version = $versionLine.Matches[0].Groups[1].Value
          wails build -platform windows/amd64 -clean -ldflags "-X forge-api-client/version.Version=$version -X forge-api-client/version.Commit=$commit -X forge-api-client/version.BuildDate=$date"

      - name: Upload unsigned CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetriyonAPI-windows-amd64-unsigned
          path: build/bin/MetriyonAPI.exe
          if-no-files-found: error
