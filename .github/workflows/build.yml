name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test Go packages
        run: go test ./...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Build and package Windows AMD64
        shell: pwsh
        run: |
          $commit = "${{ github.sha }}".Substring(0, 7)
          $date = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          $versionLine = Select-String -Path version/version.go -Pattern 'Version\s*=\s*"([^"]+)"'
          $version = $versionLine.Matches[0].Groups[1].Value
          wails build -platform windows/amd64 -clean -ldflags "-X forge-api-client/version.Version=$version -X forge-api-client/version.Commit=$commit -X forge-api-client/version.BuildDate=$date"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exeName = "MetriyonAPI-$version-windows-amd64-unsigned.exe"
          $zipName = "MetriyonAPI-$version-windows-amd64-unsigned.zip"

          Copy-Item build/bin/MetriyonAPI.exe "dist/$exeName"
          Copy-Item LICENSE dist/LICENSE.txt
          Copy-Item README.md dist/README.md

          Compress-Archive `
            -Path "dist/$exeName", dist/LICENSE.txt, dist/README.md `
            -DestinationPath "dist/$zipName"

          (Get-FileHash "dist/$exeName" -Algorithm SHA256).Hash.ToLower() + "  $exeName" | Out-File -Encoding ascii "dist/SHA256SUMS.txt"
          (Get-FileHash "dist/$zipName" -Algorithm SHA256).Hash.ToLower() + "  $zipName" | Add-Content -Encoding ascii "dist/SHA256SUMS.txt"

      - name: Upload unsigned CI package
        uses: actions/upload-artifact@v4
        with:
          name: MetriyonAPI-windows-amd64-unsigned
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
